<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taji Luxury Events And Academy</title>
    <meta
      name="description"
      content="Luxury event production and a premier academy for planners, stylists, and floral artists."
    />
    <link rel="icon" type="image/png" href="/img/logos/TAJIMAINBRAND.png" />
    <link rel="apple-touch-icon" href="/img/logos/TAJIMAINBRAND.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600&amp;family=Montserrat:wght@300;400;500;600&amp;family=Playfair+Display:wght@500;600&amp;display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <script>
      (function () {
        var search = window.location.search
        if (!search || search.indexOf('?p=') !== 0) return
        var params = new URLSearchParams(search)
        var path = params.get('p')
        if (!path) return
        var query = params.get('q')
        var newPath = '/' + decodeURIComponent(path)
        var newSearch = query ? '?' + decodeURIComponent(query) : ''
        var newUrl = newPath + newSearch + window.location.hash
        window.history.replaceState(null, '', newUrl)
      })()
    </script>
  </head>
  <body>
    <div id="root"><p id="startup-message" style="font: 16px Arial, sans-serif; color: #981f2f; text-align: center; padding: 4rem 1rem;">Loading Taji Luxury Events and Academy…</p></div>
    <script>
      window.setTimeout(function () {
        var message = document.getElementById('startup-message')
        if (message) {
          message.innerHTML = 'The page is taking too long to load.<br><a href="/" style="color:#981f2f">Try reloading</a>.'
        }
      }, 12000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
